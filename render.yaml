services:
  # -------------------------------------------------------------
  # Backend API (Docker Web Service)
  # -------------------------------------------------------------
  - type: web
    name: scholarship-navigator-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: sqlite
      - key: ALLOWED_HOSTS
        value: scholarship-navigator-api.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://scholarship-navigator-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://scholarship-navigator-web.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SERVE_STATIC
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: VECTOR_INDEX_DIR
        value: /app/var/index
      - key: HF_HOME
        value: /opt/huggingface
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: HF_HUB_DISABLE_SHARED_BLOBS
        value: "1"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"

  # -------------------------------------------------------------
  # Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: scholarship-navigator-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://scholarship-navigator-api.onrender.com
